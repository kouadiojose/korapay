name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: korapay_test
          POSTGRES_USER: korapay
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: packages/backend

      - name: Run migrations
        run: npm run migrate
        working-directory: packages/backend
        env:
          DATABASE_URL: postgresql://korapay:password@localhost:5432/korapay_test
          NODE_ENV: test

      - name: Run tests
        run: npm test
        working-directory: packages/backend
        env:
          DATABASE_URL: postgresql://korapay:password@localhost:5432/korapay_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret
          NODE_ENV: test

      - name: Build
        run: npm run build
        working-directory: packages/backend

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: packages/frontend

      - name: Build
        run: npm run build
        working-directory: packages/frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
