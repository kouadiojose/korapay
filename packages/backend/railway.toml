[build]
builder = "nixpacks"
buildCommand = "npm install --prefix /app/packages/backend && cd /app/packages/backend && npx tsc"

[deploy]
startCommand = "cd /app/packages/backend && (npx knex migrate:latest --knexfile knexfile.js --env production 2>&1 || true) && node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
