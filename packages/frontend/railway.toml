[build]
builder = "nixpacks"
buildCommand = "npm install --prefix /app/packages/frontend && cd /app/packages/frontend && npx next build"

[deploy]
startCommand = "cd /app/packages/frontend && npx next start -H 0.0.0.0 -p ${PORT:-3000}"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
